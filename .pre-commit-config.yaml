# Pre-commit formats and lints staged files; pre-push runs the fast gate.
# Install with: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: catalog
        name: generated catalog is current
        entry: uv run python scripts/generate_catalog.py --check
        language: system
        pass_filenames: false
        files: ^(src/irp/contracts/|docs/mcp-contracts\.md)
      - id: fast-gate
        name: types and fast tests
        entry: bash -c 'uv run mypy && uv run pytest -q -m "not docker and not golden and not network"'
        language: system
        pass_filenames: false
        stages: [pre-push]

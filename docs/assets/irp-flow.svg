<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="title desc">
  <title id="title">How IRP works</title>
  <desc id="desc">You ask your agent to build a paper. The agent reads the paper, writes code and decides runs, calling IRP's tools. IRP fetches the paper, builds environments, runs code, extracts numbers and judges claims through swappable providers, logging every step in a hash-chained evidence log. The report is written from that log alone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6f76"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 17px; font-weight: 600; }
      .body { font-size: 13px; fill: #4b5058; }
      .label { font-size: 12px; fill: #6b6f76; }
      .box { fill: #ffffff; stroke: #c9ccd1; stroke-width: 1.5; }
      .core { fill: #f4f6ff; stroke: #5c4ee5; stroke-width: 2; }
      .proof { fill: #f2fbf4; stroke: #2f9e55; stroke-width: 2; }
      .provider { fill: #f6f7f8; stroke: #c9ccd1; stroke-width: 1.2; }
      .edge { stroke: #6b6f76; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="408" rx="18" fill="#fbfbfc" stroke="#e1e4e8"/>

  <rect class="box" x="30" y="40" width="200" height="120" rx="12"/>
  <text class="title" x="130" y="72" text-anchor="middle">You</text>
  <text class="body" x="130" y="98" text-anchor="middle">"Build arXiv 2501.12345</text>
  <text class="body" x="130" y="116" text-anchor="middle">and check Table 2."</text>
  <text class="body" x="130" y="142" text-anchor="middle">Read the report.</text>

  <rect class="box" x="290" y="40" width="250" height="120" rx="12"/>
  <text class="title" x="415" y="72" text-anchor="middle">Your agent: the brain</text>
  <text class="body" x="415" y="98" text-anchor="middle">Claude Code, Codex or Cursor</text>
  <text class="body" x="415" y="116" text-anchor="middle">reads the paper, writes code,</text>
  <text class="body" x="415" y="134" text-anchor="middle">decides runs</text>

  <rect class="core" x="600" y="40" width="300" height="120" rx="12"/>
  <text class="title" x="750" y="72" text-anchor="middle">IRP: one core</text>
  <text class="body" x="750" y="98" text-anchor="middle">MCP server and CLI, same tools</text>
  <text class="body" x="750" y="116" text-anchor="middle">fetch · claims · env · run</text>
  <text class="body" x="750" y="134" text-anchor="middle">measure · judge · report</text>

  <rect class="proof" x="960" y="40" width="210" height="120" rx="12"/>
  <text class="title" x="1065" y="72" text-anchor="middle">Evidence log</text>
  <text class="body" x="1065" y="98" text-anchor="middle">every step, hash-chained</text>
  <text class="body" x="1065" y="116" text-anchor="middle">numbers only from runs,</text>
  <text class="body" x="1065" y="134" text-anchor="middle">with file and line</text>

  <path class="edge" d="M230,100 L286,100" marker-end="url(#arrow)"/>
  <text class="label" x="258" y="92" text-anchor="middle">asks</text>
  <path class="edge" d="M540,100 L596,100" marker-end="url(#arrow)"/>
  <text class="label" x="568" y="92" text-anchor="middle">calls</text>
  <path class="edge" d="M900,100 L956,100" marker-end="url(#arrow)"/>
  <text class="label" x="928" y="92" text-anchor="middle">logs</text>

  <rect class="proof" x="960" y="230" width="210" height="150" rx="12"/>
  <text class="title" x="1065" y="262" text-anchor="middle">Report</text>
  <text class="body" x="1065" y="288" text-anchor="middle">claim table, 4 verdicts</text>
  <text class="body" x="1065" y="306" text-anchor="middle">guesses, method map</text>
  <text class="body" x="1065" y="324" text-anchor="middle">provenance and a</text>
  <text class="body" x="1065" y="342" text-anchor="middle">verify command</text>
  <path class="edge" d="M1065,160 L1065,226" marker-end="url(#arrow)"/>
  <text class="label" x="1055" y="198" text-anchor="end">written only from the log</text>


  <rect class="provider" x="560" y="230" width="380" height="150" rx="12"/>
  <text class="title" x="750" y="258" text-anchor="middle">Providers: swappable</text>
  <rect class="box" x="575" y="275" width="112" height="90" rx="8"/>
  <text class="body" x="631" y="298" text-anchor="middle" font-weight="600">Paper intake</text>
  <text class="body" x="631" y="318" text-anchor="middle">arXiv LaTeX</text>
  <text class="body" x="631" y="335" text-anchor="middle">PDF parsers</text>
  <text class="body" x="631" y="352" text-anchor="middle">page images</text>
  <rect class="box" x="694" y="275" width="112" height="90" rx="8"/>
  <text class="body" x="750" y="298" text-anchor="middle" font-weight="600">Environments</text>
  <text class="body" x="750" y="318" text-anchor="middle">uv venvs</text>
  <text class="body" x="750" y="335" text-anchor="middle">Docker images</text>
  <text class="body" x="750" y="352" text-anchor="middle">lock files</text>
  <rect class="box" x="813" y="275" width="112" height="90" rx="8"/>
  <text class="body" x="869" y="298" text-anchor="middle" font-weight="600">Compute</text>
  <text class="body" x="869" y="318" text-anchor="middle">local CPU or GPU</text>
  <text class="body" x="869" y="335" text-anchor="middle">Modal (approved)</text>
  <text class="body" x="869" y="352" text-anchor="middle">time-capped</text>
  <path class="edge" d="M750,160 L750,226" marker-end="url(#arrow)"/>

  <rect class="box" x="30" y="230" width="490" height="150" rx="12"/>
  <text class="title" x="50" y="256">Six hard rules (the tools enforce what they can)</text>
  <text class="body" x="50" y="280">1. Never type a number as a result.</text>
  <text class="body" x="50" y="297">2. Never change the method to make a run succeed; record a guess.</text>
  <text class="body" x="50" y="314">3. Could not run? Report it with the blocking error.</text>
  <text class="body" x="50" y="331">4. Run the smallest faithful version first; shortened runs never count.</text>
  <text class="body" x="50" y="348">5. Record every claim before writing any code.</text>
  <text class="body" x="50" y="365">6. Ask before any paid compute.</text>
</svg>
